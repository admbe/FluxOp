# Generated by scripts/generate_rill_project.py -- do not edit.

version: 1
type: metrics_view
display_name: Flux focus cost
model: flux_focus_cost
timeseries: charge_period_start

dimensions:
  - name: charge_category
    column: charge_category
  - name: pricing_category
    column: pricing_category
  - name: commitment_discount_category
    column: commitment_discount_category
  - name: commitment_discount_type
    column: commitment_discount_type
  - name: service_category
    column: service_category
  - name: service_name
    column: service_name
  - name: subscription_name
    column: subscription_name
  - name: resource_group
    column: resource_group
  - name: resource_type
    column: resource_type
  - name: region_name
    column: region_name
  - name: billing_currency
    column: billing_currency

measures:
  - name: billed_cost
    expression: SUM(billed_cost)
    description: Invoice-basis cost.
    format_preset: currency_usd
  - name: effective_cost
    expression: SUM(effective_cost)
    description: Amortized-basis cost with commitments spread.
    format_preset: currency_usd
  - name: contracted_cost
    expression: SUM(contracted_cost)
    format_preset: currency_usd
  - name: list_cost
    expression: SUM(list_cost)
    format_preset: currency_usd
  - name: billed_vs_effective
    expression: SUM(billed_cost - effective_cost)
    description: Positive when invoices front-load commitment purchases.
    format_preset: currency_usd
  - name: negotiated_discount
    expression: SUM(list_cost - contracted_cost)
    description: Value of negotiated rates against list price. Understated where the export omits list price; the price sheet feed closes that gap.
    format_preset: currency_usd
  - name: commitment_discount_savings
    expression: SUM(contracted_cost - effective_cost)
    description: Savings from reservations and savings plans against the negotiated rate.
    format_preset: currency_usd
  - name: total_savings
    expression: SUM(list_cost - effective_cost)
    description: Negotiated plus commitment savings against list price.
    format_preset: currency_usd
  - name: effective_savings_rate
    expression: 100.0 * SUM(list_cost - effective_cost) / NULLIF(SUM(list_cost), 0)
    description: The FinOps Framework ESR: share of list price you do not pay. Understated where list price is missing at the source.
    format_preset: percentage
  - name: commitment_covered_cost
    expression: SUM(CASE WHEN coalesce(commitment_discount_category, '') <> '' THEN effective_cost ELSE 0 END)
    description: Effective cost carrying a reservation or savings plan.
    format_preset: currency_usd
  - name: on_demand_cost
    expression: SUM(CASE WHEN coalesce(commitment_discount_category, '') = '' THEN effective_cost ELSE 0 END)
    description: Effective cost with no commitment discount applied.
    format_preset: currency_usd
  - name: commitment_coverage_percent
    expression: 100.0 * SUM(CASE WHEN coalesce(commitment_discount_category, '') <> '' THEN effective_cost ELSE 0 END) / NULLIF(SUM(effective_cost), 0)
    description: Share of effective cost covered by commitments.
    format_preset: percentage
  - name: charge_count
    expression: COUNT(*)
  - name: resource_count
    expression: COUNT(DISTINCT NULLIF(resource_id, ''))
