    expression: AVG(CASE WHEN market_price > 0 AND unit_price IS NOT NULL THEN 100.0 * (market_price - unit_price) / market_price END)
    description: Unweighted mean discount versus market price across priced meters -- directional, not spend-weighted.
    format_preset: percentage
