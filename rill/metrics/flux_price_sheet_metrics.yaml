version: 1
type: metrics_view
display_name: Flux price sheet
model: flux_price_sheet

dimensions:
  - name: service_family
    column: service_family
  - name: price_type
    column: price_type
  - name: product
    column: product
  - name: unit_of_measure
    column: unit_of_measure
  - name: currency
    column: currency

measures:
  - name: meter_count
    expression: COUNT(DISTINCT NULLIF(meter_id, ''))
  - name: discounted_meters
    expression: COUNT(CASE WHEN unit_price IS NOT NULL AND market_price IS NOT NULL AND unit_price < market_price THEN 1 END)
